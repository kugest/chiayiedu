            margin-bottom: 15px;

            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        /* === 標題與版面 === */
        .section-title {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 15px;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.75rem;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }
        .section-padding { padding: 60px 0; }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .filter-btn-group .btn {
            border-radius: 20px;
            font-size: 0.9rem;
            padding: 6px 16px;
            flex: 0 0 auto;
        }
        .form-select {
            font-size: 16px;
        }

        /* === 相簿卡片 Mobile 優化 === */
        .album-card {
            display: block; 
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            height: 100%;
            text-decoration: none; 
            position: relative;
            color: inherit;
        }
        .album-img-wrapper {
            position: relative;
            padding-top: 66.66%;
            overflow: hidden;
            background: #eee;
        }
        .album-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .school-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 51, 102, 0.9);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 2;
        }
        .album-info { padding: 15px; }
        .album-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .album-meta {
            font-size: 0.85rem;
            color: #777;
            display: flex;
            justify-content: space-between;
        }

        .news-item {
            border-left: 4px solid var(--accent-color);
            background: white;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 0 5px 5px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);

            color: var(--primary-color);
            font-weight: 700;
            margin-right: 10px;
            font-size: 0.9rem;

        .badge { font-weight: 500; }

            align-items: flex-start;

            text-align: center;
        }
        footer {

        }

                        '嘉義高工/230838_0.jpg',
                        '嘉義高工/230839_0.jpg'
                    ]
                }
            ]
        };

        // === 核心程式 ===
        const App = {
            currentFilter: { category: 'all', school: 'all' },
            lightbox: null,

            init() {
                this.checkLoginStatus();
                this.loadNews();
                this.renderAlbums();
                this.bindEvents();
            },

            bindEvents() {
                const loginForm = document.getElementById('loginForm');
                if (loginForm) {
                    loginForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        this.handleLogin();
                    });
                }

                document.querySelectorAll('#category-filters button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        // 確保移除所有 active
                        document.querySelectorAll('#category-filters button').forEach(b => {
                            b.classList.remove('active', 'btn-primary');
                            b.classList.add('btn-outline-primary');
                        });
                        
                        // 使用 currentTarget 確保抓到 button 元素
                        const target = e.currentTarget;
                        target.classList.remove('btn-outline-primary');
                        target.classList.add('active', 'btn-primary');
                        
                        this.currentFilter.category = target.getAttribute('data-filter');
                        this.renderAlbums();
                    });
                });

                const schoolFilter = document.getElementById('school-filter');
                if (schoolFilter) {
                    schoolFilter.addEventListener('change', (e) => {
                        this.currentFilter.school = e.target.value;
                        this.renderAlbums();
                    });
                }
            },

            checkLoginStatus() {
                try {
                    const user = JSON.parse(localStorage.getItem('user'));
                    const authSection = document.getElementById('auth-section');
                    if (user && authSection) {
                        authSection.innerHTML = `
                            <div class="dropdown">
                                <button class="btn btn-primary dropdown-toggle rounded-pill px-4 w-100" type="button" data-bs-toggle="dropdown">
                                    <i class="fa-solid fa-circle-user me-1"></i> ${user.name} 老師
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end shadow w-100 text-center text-lg-start">
                                    <li><a class="dropdown-item" href="#">會員專區</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item text-danger" href="#" onclick="App.logout()">登出</a></li>
                                </ul>
                            </div>`;
                    }
                } catch (e) {
                    console.error("Login status check failed", e);
                }
            },

            handleLogin() {
                const userVal = document.getElementById('username').value;
                if (userVal) {
                    const mockUser = { name: "陳大文", role: "admin" };
                    localStorage.setItem('user', JSON.stringify(mockUser));
                    
                    const modalEl = document.getElementById('loginModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();
                    
                    this.checkLoginStatus();
                } else {
                    document.getElementById('login-error').innerText = '請輸入帳號';
                }
            },

            logout() {
                localStorage.removeItem('user');
                location.reload();
            },

            loadNews() {
                const container = document.getElementById('news-container');
                if (!container) return;
                
                let html = '';
                // 日期排序 (新 -> 舊)
                const sortedNews = [...FULL_DATA.news].sort((a, b) => new Date(b.date) - new Date(a.date));

                sortedNews.forEach(item => {
                    html += `
                        <div class="news-item">
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-secondary me-2">${item.category}</span>
                                <span class="news-date">${item.date}</span>
                            </div>
                            <h5 class="fw-bold mb-1"><a href="#" class="text-decoration-none text-dark stretched-link">${item.title}</a></h5>
                            <p class="mb-0 text-muted text-truncate">${item.desc}</p>
                        </div>`;
                });
                container.innerHTML = html;
            },

            renderAlbums() {
                const container = document.getElementById('albums-container');
                if (!container) return;
                
                container.innerHTML = '';

                const filtered = FULL_DATA.albums.filter(album => {
                    const matchCat = this.currentFilter.category === 'all' || album.category === this.currentFilter.category;
                    const matchSchool = this.currentFilter.school === 'all' || album.school === this.currentFilter.school;
                    return matchCat && matchSchool;
                });

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="col-12 text-center py-5 text-muted">沒有找到符合條件的相簿</div>`;
                    return;
                }

                let html = '';
                filtered.forEach(album => {
                    const coverSrc = album.cover.startsWith('http') ? album.cover : UPLOAD_PATH + album.cover;
                    
                    html += `
                        <div class="col-md-4 col-sm-6">
                            <a href="${coverSrc}" class="album-card glightbox" data-gallery="gallery-${album.id}" data-title="${album.title}" data-description="${album.date} - ${album.school}">
                                <div class="school-badge shadow-sm">${album.school}</div>
                                <div class="album-img-wrapper">
                                    <img src="${coverSrc}" class="album-img" alt="${album.title}" onerror="this.src='https://placehold.co/600x400?text=No+Image'">
                                </div>
                                <div class="album-info">
                                    <h5 class="album-title">${album.title}</h5>
                                    <div class="album-meta">
                                        <span><i class="far fa-images me-1"></i> ${album.photos.length} 張照片</span>
                                        <span><i class="far fa-clock me-1"></i> ${album.date}</span>
                                    </div>
                                </div>
                            </a>
                            <div class="d-none">`;

                    if(album.photos.length > 0) {
                        album.photos.forEach((photo, idx) => {
                            if (photo === album.cover) return;
                            const photoSrc = photo.startsWith('http') ? photo : UPLOAD_PATH + photo;
                            html += `<a href="${photoSrc}" class="glightbox" data-gallery="gallery-${album.id}" data-title="${album.title} (${idx+1})"></a>`;
                        });
                    }

                    html += `</div></div>`;
                });

                container.innerHTML = html;
                this.initLightbox();
            },

            initLightbox() {
                if (this.lightbox) {
                    this.lightbox.destroy(); 
                }
                this.lightbox = GLightbox({
                    selector: '.glightbox', 
                    touchNavigation: true,
                    loop: true,             
                    zoomable: true,         
                    closeOnOutsideClick: true
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
